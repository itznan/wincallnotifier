name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.1.0)'
        required: false
        type: string
        default: ''
      draft:
        description: 'Create draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Create pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (Windows x86_64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          cache: true

      - name: Build Release Binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Setup Inno Setup
        shell: powershell
        run: |
          $innoPath = "C:\Program Files (x86)\Inno Setup 6"
          if (Test-Path "$innoPath\ISCC.exe") {
            echo "$innoPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            choco install innosetup --no-progress
            echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Determine Release Tag
        id: get_tag
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.tag_name }}" -ne "") {
            $tag = "${{ inputs.tag_name }}"
          } elseif ($env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF -replace "refs/tags/", ""
          } else {
            $ver = (Select-String -Path "Cargo.toml" -Pattern '^version\s*=\s*"([^"]+)"').Matches.Groups[1].Value
            $tag = "v$ver"
          }
          $cleanVersion = $tag.TrimStart("v")
          Write-Host "Using release tag: $tag, clean version: $cleanVersion"
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "APP_VERSION=$cleanVersion" >> $env:GITHUB_ENV

      - name: Compile Windows Installer
        shell: powershell
        run: |
          ISCC.exe /DMyAppVersion="${{ env.APP_VERSION }}" installer.iss

      - name: Prepare Release Artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "release_assets" -Force | Out-Null
          New-Item -ItemType Directory -Path "dist_zip" -Force | Out-Null

          # Copy main binary and documentation into zip staging directory
          Copy-Item "target\x86_64-pc-windows-msvc\release\wincallnotifier.exe" -Destination "dist_zip\"
          Copy-Item "README.md" -Destination "dist_zip\"

          # 1. Official Windows Installer Wizard (.exe)
          if (Test-Path "dist-installer\WinCallNotifier-Installer.exe") {
            Copy-Item "dist-installer\WinCallNotifier-Installer.exe" -Destination "release_assets\WinCallNotifier-Installer.exe"
          }

          # 2. Portable Standalone ZIP Package (.zip)
          Compress-Archive -Path "dist_zip\*" -DestinationPath "release_assets\WinCallNotifier-Portable.zip" -Force

          # 3. Generate SHA256 Checksums
          Set-Location -Path "release_assets"
          $checksums = Get-ChildItem -File | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $checksums | Out-File -FilePath "SHA256SUMS.txt" -Encoding ascii
          Set-Location -Path ".."

          Get-ChildItem -Path "release_assets"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WinCallNotifier-Windows
          path: release_assets/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: WinCallNotifier ${{ env.RELEASE_TAG }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            release_assets/WinCallNotifier-Installer.exe
            release_assets/WinCallNotifier-Portable.zip
            release_assets/SHA256SUMS.txt
